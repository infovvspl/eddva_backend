name: Deploy Backend (DEV)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build
          test -f dist/main.js

      # The build happens here, on GitHub's machine, and only the result goes to
      # the server. The server used to run npm ci + nest build itself: minutes of
      # full CPU on the 2-CPU box that also serves PRODUCTION (eddva.in), which
      # made dev and prod slow on every push - and an npm ci that failed half-way
      # (an ffmpeg-static download 504) left the server without node_modules.
      - name: Package the build
        run: |
          mkdir -p release
          tar -czf release/dist.tgz dist

      - name: Get runner IP and open EC2 security group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" \
            --description "GitHub Actions runner (auto-removed)" || true

      - name: Upload the build to EC2 (DEV)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: release/dist.tgz
          target: /home/ubuntu/eddva_backend_dev/.release
          strip_components: 1

      - name: Deploy to EC2 (DEV)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SCHOOL_JWT_SECRET
          # Usually seconds now (no build here). Headroom for the occasional
          # npm ci, which runs only when package-lock.json changed.
          command_timeout: 25m
          script: |
            set -e
            cd /home/ubuntu/eddva_backend_dev
            git fetch --all
            git reset --hard origin/dev
            mkdir -p .release
            # Packages are reinstalled only when package-lock.json changed (most
            # pushes do not), and at low priority so production keeps the CPU.
            LOCK_SHA=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ ! -d node_modules ] || [ "$(cat .release/deps.sha 2>/dev/null)" != "$LOCK_SHA" ]; then
              echo "package-lock.json changed: npm ci"
              nice -n 10 ionice -c3 npm ci
              echo "$LOCK_SHA" > .release/deps.sha
              # Prune the install caches. ffmpeg-static's postinstall downloads a
              # ~70MB binary into ~/.cache on every npm ci, and nothing ever
              # removed it: on 2026-10-04 that cache had reached 9.1GB across
              # ~130 deploys, filled the 24GB root volume, killed the pm2 daemon
              # and took dev AND prod down until the disk was cleared by hand.
              # Both caches are rebuilt on demand, so dropping them costs only a
              # slower next install.
              rm -rf /home/ubuntu/.cache/ffmpeg-static-nodejs "$HOME/.npm/_cacache"
            else
              echo "package-lock.json unchanged: keeping node_modules"
            fi
            # The new build goes in next to the running one and is swapped in
            # just before the restart; the previous one is kept for rollback.
            rm -rf dist.new && mkdir dist.new
            tar -xzf .release/dist.tgz -C dist.new --strip-components=1
            test -f dist.new/main.js
            rm -rf dist.prev
            if [ -d dist ]; then mv dist dist.prev; fi
            mv dist.new dist
            grep -q '^SCHOOL_JWT_SECRET=' .env \
              && sed -i "s|^SCHOOL_JWT_SECRET=.*|SCHOOL_JWT_SECRET=${SCHOOL_JWT_SECRET}|" .env \
              || echo "SCHOOL_JWT_SECRET=${SCHOOL_JWT_SECRET}" >> .env
            grep -q '^INTERNAL_API_KEY=' .env \
              && sed -i 's|^INTERNAL_API_KEY=.*|INTERNAL_API_KEY=edva_internal_ai_log_2026|' .env \
              || echo 'INTERNAL_API_KEY=edva_internal_ai_log_2026' >> .env
            # P0 SSRF: /school/materials/proxy-pdf fetches a caller-supplied URL,
            # so it may only reach these exact hosts. Derived from the DEV school
            # material inventory (study_materials.s3_key). Hostnames are not
            # secrets. Unset means "allow nothing" and the endpoint fails closed,
            # so this must be written before the hardened build starts.
            PROXY_HOSTS='pub-22354a2b0e694b93bcce0d5fb28e22a2.r2.dev,eddva-dev-media-871545.s3.ap-south-1.amazonaws.com,eddva.s3.ap-south-1.amazonaws.com,media.eddva.in'
            grep -q '^SCHOOL_PROXY_PDF_ALLOWED_HOSTS=' .env \
              && sed -i "s|^SCHOOL_PROXY_PDF_ALLOWED_HOSTS=.*|SCHOOL_PROXY_PDF_ALLOWED_HOSTS=${PROXY_HOSTS}|" .env \
              || echo "SCHOOL_PROXY_PDF_ALLOWED_HOSTS=${PROXY_HOSTS}" >> .env
            if pm2 list | grep -q eddva-backend-dev; then
              pm2 restart eddva-backend-dev --update-env
            else
              mkdir -p /home/ubuntu/logs
              pm2 start dist/main.js \
                --name eddva-backend-dev \
                -i 1 \
                --max-memory-restart 400M \
                --log /home/ubuntu/logs/backend-dev.log
            fi
            # Healthy = the API answers (401 without a login). If the new build
            # does not come up within 90s, the previous build is put back.
            PORT=$(grep -E '^PORT=' .env | tail -1 | cut -d= -f2 | tr -dc '0-9'); PORT=${PORT:-3001}
            healthy() {
              for i in $(seq 1 45); do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "http://127.0.0.1:${PORT}/api/v1/school/auth/me" || true)
                if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "healthy after about $((i * 2))s"; return 0; fi
                sleep 2
              done
              return 1
            }
            if ! healthy; then
              echo "New build did not come up; rolling back to the previous build"
              if [ -d dist.prev ]; then
                rm -rf dist.failed && mv dist dist.failed && mv dist.prev dist
                pm2 restart eddva-backend-dev --update-env
                healthy || echo "Previous build did not come up either"
              fi
              exit 1
            fi
            pm2 save

      - name: Remove runner IP from EC2 security group
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

      - name: Notify success
        if: success()
        run: echo "DEV Backend deployed to dev-api.eddva.in (port 3001)"
